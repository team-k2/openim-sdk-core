name: Build Android SDK

on:
  workflow_dispatch:  # 手動觸發
  push:
    branches: [ completeEditMessage ]
    paths:
      - '**'
      - '.github/workflows/build-android-sdk.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install gomobile
        run: |
          # 使用最新版本的 gomobile（與 Go 1.23 相容）
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android NDK
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653" "platforms;android-33" "build-tools;33.0.2"

      - name: Initialize gomobile
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653

          echo "Initializing gomobile with Go $(go version)..."
          gomobile init

          echo "✅ gomobile initialized successfully"

      - name: Build Android SDK
        run: |
          go mod tidy

          mkdir -p output/android

          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653

          gomobile bind -v \
            -target=android \
            -androidapi 21 \
            -o output/android/OpenIMSDK.aar \
            -ldflags='-s -w' \
            ./open_im_sdk ./open_im_sdk_callback

      - name: Verify build
        run: |
          ls -lh output/android/
          file output/android/OpenIMSDK.aar
          unzip -l output/android/OpenIMSDK.aar | head -20

      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenIMSDK-aar
          path: output/android/OpenIMSDK.aar
          retention-days: 30

      - name: Create release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: output/android/OpenIMSDK.aar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
